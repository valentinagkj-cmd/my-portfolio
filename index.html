<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Valentina | Computer Science Student</title>

    <style>
        :root {
            --ivory: #faf8f5;
            --white: #ffffff;
            --rose: #b98282;
            --rose-light: #ead8d6;
            --brown: #3d3331;
            --muted: #756967;
            --border: #e8dfdc;
            --shadow: 0 12px 35px rgba(61, 51, 49, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--ivory);
            color: var(--brown);
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1100px, 90%);
            margin: auto;
        }

        /* NAVIGATION */

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(250, 248, 245, 0.94);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            min-height: 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: -1px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
            font-size: 0.92rem;
        }

        .nav-links a {
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--rose);
        }

        /* HERO */

        .hero {
            min-height: 88vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 720px;
        }

        .eyebrow {
            color: var(--rose);
            font-size: 0.82rem;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            line-height: 1;
            letter-spacing: -4px;
            margin-bottom: 25px;
        }

        .hero p {
            max-width: 580px;
            color: var(--muted);
            font-size: 1.08rem;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 30px;
            border: 1px solid var(--rose);
            transition: 0.3s;
            font-size: 0.92rem;
        }

        .btn-primary {
            background: var(--rose);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .hero-circle {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: var(--rose-light);
            right: 4%;
            top: 25%;
            opacity: 0.65;
            z-index: -1;
        }

        /* SECTIONS */

        section {
            padding: 100px 0;
        }

        .section-label {
            color: var(--rose);
            font-size: 0.78rem;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 2.4rem;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .section-intro {
            max-width: 650px;
            color: var(--muted);
            margin-bottom: 45px;
        }

        /* ABOUT */

        .about-box {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .about-box p {
            color: var(--muted);
            max-width: 800px;
        }

        /* SKILLS */

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .skill {
            background: var(--white);
            border: 1px solid var(--border);
            padding: 22px;
            border-radius: 18px;
            transition: 0.3s;
        }

        .skill:hover {
            transform: translateY(-5px);
            border-color: var(--rose-light);
            box-shadow: var(--shadow);
        }

        .skill h3 {
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .skill p {
            color: var(--muted);
            font-size: 0.85rem;
        }

        /* PROJECTS */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .project-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 30px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.3s;
        }

        .project-card:hover {
            transform: translateY(-7px);
            box-shadow: var(--shadow);
        }

        .project-number {
            color: var(--rose);
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .project-card h3 {
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        .project-card p {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .tech {
            margin-top: 25px;
            color: var(--rose);
            font-size: 0.78rem;
            font-weight: bold;
        }

        /* EDUCATION */

        .education-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 35px;
            box-shadow: var(--shadow);
        }

        .education-card h3 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .education-card p {
            color: var(--muted);
        }

        /* LEARNING */

        .learning-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .learning-item {
            padding: 25px;
            border-left: 3px solid var(--rose);
            background: var(--white);
            border-radius: 0 16px 16px 0;
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .learning-item h3 {
            margin-bottom: 8px;
        }

        .learning-item p {
            color: var(--muted);
            font-size: 0.88rem;
        }

        /* CONTACT */

        .contact-box {
            background: var(--brown);
            color: white;
            border-radius: 28px;
            padding: 55px;
            text-align: center;
        }

        .contact-box .section-label {
            color: var(--rose-light);
        }

        .contact-box h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

            color: #ddd4d1;
            max-width: 550
